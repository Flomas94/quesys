[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quesys"
version = "0.1.3"
description = "SLURM job helper utilities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "humanfriendly>=10.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
